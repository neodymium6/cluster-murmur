name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_notes: ${{ steps.identity.outputs.release_notes }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      revision: ${{ steps.identity.outputs.revision }}
      version: ${{ steps.identity.outputs.version }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Validate tag, version, ancestry, and release notes
        id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(< VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a bounded release version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "release tag does not match VERSION" >&2
            exit 1
          fi

          revision="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          event_revision="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [[ "$event_revision" != "$revision" ]]; then
            echo "release event revision does not match the tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$revision" refs/remotes/origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi

          release_notes="docs/release-notes-$RELEASE_TAG.md"
          if [[ ! -f "$release_notes" || -L "$release_notes" ]]; then
            echo "release notes are missing or not a regular file" >&2
            exit 1
          fi

          {
            echo "release_notes=$release_notes"
            echo "release_tag=$RELEASE_TAG"
            echo "revision=$revision"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch Mix dependencies
        run: nix develop --command mix deps.get

      - name: Run repository checks
        run: nix develop --command just ci

  publish:
    name: Publish artifacts and prepare draft release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_NOTES: ${{ needs.validate.outputs.release_notes }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      SOURCE_REVISION: ${{ needs.validate.outputs.revision }}
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out the validated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Build and smoke-check the release image
        run: |
          nix build .#checks.x86_64-linux.container-image --no-link
          nix build .#container-image --out-link result
          nix build .#release-tools --out-link release-tools

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: true

      - name: Prepare and publish the image
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          export PATH="$PWD/release-tools/bin:$PATH"
          image_name="${IMAGE_NAME,,}"
          registry_auth="$HOME/.docker/config.json"

          skopeo --insecure-policy copy "docker-archive:result" \
            "oci:release-image:$VERSION"
          image_os="$(skopeo inspect --format '{{.Os}}' "oci:release-image:$VERSION")"
          image_architecture="$(
            skopeo inspect --format '{{.Architecture}}' "oci:release-image:$VERSION"
          )"
          if [[ "$image_os/$image_architecture" != "linux/amd64" ]]; then
            echo "release image does not match the declared platform" >&2
            exit 1
          fi

          expected_digest="sha256:$(
            skopeo inspect --raw "oci:release-image:$VERSION" | sha256sum | cut -d ' ' -f 1
          )"
          digest_alias="sha256-${expected_digest#sha256:}"
          published_image="$image_name:$digest_alias"
          skopeo --insecure-policy copy --authfile "$registry_auth" --retry-times 3 \
            "oci:release-image:$VERSION" "docker://$published_image"

          published_digest="$(
            skopeo inspect --authfile "$registry_auth" \
              --format '{{.Digest}}' "docker://$published_image"
          )"
          if [[ "$published_digest" != "$expected_digest" ]]; then
            echo "published image digest does not match the built manifest" >&2
            exit 1
          fi
          {
            echo "digest=$published_digest"
            echo "image_name=$image_name"
            echo "reference=$image_name@$published_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Require public package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
        run: |
          set -euo pipefail
          export PATH="$PWD/release-tools/bin:$PATH"
          owner="${GITHUB_REPOSITORY%%/*}"
          package="${GITHUB_REPOSITORY#*/}"
          package="${package,,}"
          owner_type="$(gh api "/users/$owner" --jq .type)"
          if [[ "$owner_type" == "Organization" ]]; then
            package_endpoint="/orgs/$owner/packages/container/$package"
          else
            package_endpoint="/users/$owner/packages/container/$package"
          fi
          visibility="$(gh api "$package_endpoint" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "GHCR package visibility must be changed to Public; rerun after review" >&2
            exit 1
          fi
          skopeo inspect --no-creds "docker://$IMAGE_NAME@$IMAGE_DIGEST" >/dev/null

      - name: Generate release metadata and SBOM
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
        run: |
          set -euo pipefail
          export PATH="$PWD/release-tools/bin:$PATH"
          syft "oci-dir:release-image" -o spdx-json=cluster-murmur.spdx.json
          jq -e --arg version "$VERSION" '
            .spdxVersion == "SPDX-2.3" and
            (.packages | type == "array") and
            (.packages | length > 0) and
            any(.packages[]; .name == "cluster-murmur" and .versionInfo == $version)
          ' cluster-murmur.spdx.json >/dev/null
          if (( $(stat -c '%s' cluster-murmur.spdx.json) > 16777216 )); then
            echo "SBOM exceeds the attestation size limit" >&2
            exit 1
          fi

          jq -n \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$VERSION" \
            --arg revision "$SOURCE_REVISION" \
            '{
              schema_version: 1,
              image: $image,
              digest: $digest,
              immutable_reference: ($image + "@" + $digest),
              release_tag: $tag,
              version: $version,
              source_revision: $revision,
              supported_platforms: ["linux/amd64"]
            }' > release-metadata.json
          sha256sum cluster-murmur.spdx.json release-metadata.json > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          subject-version: ${{ needs.validate.outputs.version }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          subject-version: ${{ needs.validate.outputs.version }}
          sbom-path: cluster-murmur.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          verification_ref="refs/release-verification/$GITHUB_RUN_ID"
          git fetch --no-tags origin \
            "refs/tags/$RELEASE_TAG:$verification_ref"
          current_revision="$(git rev-parse "$verification_ref^{commit}")"
          if [[ "$current_revision" != "$SOURCE_REVISION" ]]; then
            echo "release tag moved after validation" >&2
            exit 1
          fi

          expected_prerelease=false
          release_flags=(--draft)
          if [[ "$VERSION" == *-* ]]; then
            expected_prerelease=true
            release_flags+=(--prerelease)
          fi
          title="Cluster Murmur v$VERSION"
          if existing_release="$(
            gh release view "$RELEASE_TAG" \
              --json assets,body,isDraft,isPrerelease,name,tagName 2>/dev/null
          )"; then
            jq -e \
              --arg tag "$RELEASE_TAG" \
              --arg title "$title" \
              --argjson prerelease "$expected_prerelease" \
              --rawfile notes "$RELEASE_NOTES" '
                .tagName == $tag and
                .name == $title and
                .body == $notes and
                .isDraft == true and
                .isPrerelease == $prerelease and
                ([.assets[].name] - [
                  "SHA256SUMS",
                  "cluster-murmur.spdx.json",
                  "release-metadata.json"
                ] | length) == 0
              ' <<< "$existing_release" >/dev/null
          else
            gh release create "$RELEASE_TAG" \
              "${release_flags[@]}" \
              --notes-file "$RELEASE_NOTES" \
              --title "$title" \
              --verify-tag
          fi

          gh release upload "$RELEASE_TAG" \
            cluster-murmur.spdx.json release-metadata.json SHA256SUMS \
            --clobber
          mapfile -t actual_assets < <(
            gh release view "$RELEASE_TAG" \
              --json assets --jq '.assets[].name' | sort
          )
          mapfile -t expected_assets < <(
            printf '%s\n' \
              SHA256SUMS \
              cluster-murmur.spdx.json \
              release-metadata.json | sort
          )
          if [[ "${actual_assets[*]}" != "${expected_assets[*]}" ]]; then
            echo "draft release has an unexpected asset set" >&2
            exit 1
          fi
